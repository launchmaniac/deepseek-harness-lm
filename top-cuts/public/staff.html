<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Staff console — Top Cuts</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="nav">
  <div class="nav__inner container">
    <a class="brand" href="/">
      <img class="brand__logo" src="/img/logo-wordmark.svg" alt="Top Cuts — Perm &amp; Color" />
    </a>
    <nav class="nav__links" aria-label="Main">
      <a href="/">Public site</a>
      <button class="btn btn--ghost btn--small" id="signout" hidden>Sign out</button>
    </nav>
  </div>
</header>

<main id="main" class="section">
  <div class="container">

    <!-- PIN gate -->
    <section id="gate" class="gate" hidden>
      <div class="container container--narrow">
        <p class="label">Staff only</p>
        <h1 class="page-title">Enter shop PIN</h1>
        <form id="pin-form" class="pin-form" novalidate>
          <input class="input pin-input" id="pin-input" type="password" inputmode="numeric"
            autocomplete="current-password" aria-label="Shop PIN" maxlength="8" />
          <button class="btn btn--primary" type="submit">Sign in</button>
        </form>
        <p class="hint">The PIN lives in <code>config.json</code> on the shop computer.</p>
      </div>
    </section>

    <!-- Console -->
    <section id="console" hidden>
      <div class="console-head">
        <div>
          <p class="label">The books</p>
          <h1 class="page-title">Next 7 days</h1>
        </div>
        <div class="btn-row">
          <button class="btn btn--ghost btn--small" id="refresh">↻ Refresh</button>
        </div>
      </div>
      <div id="appt-list" aria-live="polite"></div>

      <section class="walkin-panel">
        <h2 class="group-title">Log a walk-in <small>blocks the chair online while they're in the seat</small></h2>
        <form id="walkin-form" class="walkin-grid" novalidate>
          <div class="field">
            <label class="label" for="w-name">Name *</label>
            <input class="input" id="w-name" required maxlength="80" placeholder="Walk-in name" />
          </div>
          <div class="field">
            <label class="label" for="w-service">Service *</label>
            <select class="input" id="w-service"></select>
          </div>
          <div class="field">
            <label class="label" for="w-chair">Chair</label>
            <select class="input" id="w-chair">
              <option value="">First available</option>
              <option value="chair-1">Chair 1</option>
              <option value="chair-2">Chair 2</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="w-date">Day</label>
            <input class="input" id="w-date" type="date" />
          </div>
          <div class="field">
            <label class="label" for="w-time">Start time</label>
            <select class="input" id="w-time"></select>
          </div>
          <div class="field">
            <label class="label" for="w-phone">Phone</label>
            <input class="input" id="w-phone" inputmode="tel" placeholder="optional" />
          </div>
          <div class="field field--full">
            <button class="btn btn--primary" type="submit">Log walk-in</button>
          </div>
        </form>
      </section>
    </section>
  </div>
</main>

<footer class="footer footer--minimal">
  <div class="container footer__inner">
    <p>Top Cuts staff console</p>
  </div>
</footer>

<script type="module" src="/js/staff.js"></script>
</body>
</html>
